version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: postgres-container
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: testdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build: ./backend
    container_name: backend-container
    ports:
      - "5000:5000"
    environment:
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: testdb
      DB_PORT: 5432
      DB_HOST: postgres   # 👈 IMPORTANT: use the service name here
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    container_name: frontend-container
    ports:
      - "3000:80"
    environment:
      REACT_APP_API_URL: http://13.201.103.218:5000/api
    depends_on:
      - backend

volumes:
  pgdata:

