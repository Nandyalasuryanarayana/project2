name: CI/CD Pipeline

on:
  workflow_dispatch: 
    # branches:
    #   - main   # run pipeline when code is pushed to main

jobs:
  build-test:
    runs-on: self-hosted

    steps:
      # Checkout code
      - name: Checkout repository
        uses: actions/checkout@v6

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # Install dependencies (backend + frontend)
      - name: Install backend dependencies
        run: |
          cd backend
          npm install

      - name: Install frontend dependencies
        run: |
          cd frontend
         # npm install --verbose

      # Run tests
      - name: Run backend tests
        run: |
          cd backend
          npm test

      - name: Run frontend tests
        run: |
          cd frontend
          npm test

      # Build frontend (compilation step)
      - name: Build frontend
        run: |
          cd frontend
          NODE_OPTIONS=--max_old_space_size=4096 npm run build

      # Upload build artifacts (optional)
      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build

  docker-build-push:
    runs-on: self-hosted
    needs: build-test   # only run if tests/build succeed

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Login to Docker registry (Docker Hub example)
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Backend
      - name: Build and push backend
        uses: docker/build-push-action@v4
        with:
         context: ./backend
         push: true
         tags: |
           sridavid/fullstack-backend:latest
           sridavid/fullstack-backend:${{ github.sha }}
           sridavid/fullstack-backend:1.0.${{ github.run_number }}

    # Frontend
      - name: Build and push frontend
        uses: docker/build-push-action@v4
        with:
         context: ./frontend
         push: true
         tags: |
          sridavid/fullstack-frontend:latest
          sridavid/fullstack-frontend:${{ github.sha }}
          sridavid/fullstack-frontend:1.0.${{ github.run_number }}

    # Database
      - name: Build and push database
        uses: docker/build-push-action@v4
        with:
         context: ./db
         push: true
         tags: |
          sridavid/fullstack-db:latest
          sridavid/fullstack-db:${{ github.sha }}
          sridavid/fullstack-db:1.0.${{ github.run_number }}





 
            




























